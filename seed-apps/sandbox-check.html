<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: #f8fbf6;
        color: #17211d;
        display: grid;
        font-family: "Aptos", "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        max-width: 720px;
      }

      h1 {
        font-size: clamp(38px, 9vw, 86px);
        line-height: .92;
        margin: 0 0 18px;
      }

      p {
        color: #5f6a64;
        font-size: 18px;
        line-height: 1.55;
        margin: 0 0 24px;
      }

      button {
        background: #17211d;
        border: 0;
        border-radius: 7px;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        min-height: 44px;
        padding: 0 18px;
      }

      output {
        display: block;
        font-size: 48px;
        font-weight: 900;
        margin-top: 22px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sandbox check</h1>
      <p>This dummy app is a complete HTML document loaded from IndexedDB into an isolated iframe.</p>
      <button id="increment" type="button">Increment local counter</button>
      <output id="count">0</output>
    </main>
    <script>
      let count = 0;
      const output = document.querySelector("#count");

      document.querySelector("#increment").addEventListener("click", () => {
        count += 1;
        output.textContent = count;
      });
    </script>
  </body>
</html>
