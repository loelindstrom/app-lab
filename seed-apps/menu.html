<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --bg: #fffaf0;
        --ink: #202723;
        --muted: #66706a;
        --line: #ddd4c4;
        --accent: #0f6d5c;
        --accent-soft: #d9eee8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(160deg, rgb(15 109 92 / 10%), transparent 34%),
          var(--bg);
        color: var(--ink);
        font-family: "Aptos", "Segoe UI", sans-serif;
      }

      main {
        margin: 0 auto;
        max-width: 980px;
        padding: 36px 22px;
      }

      header {
        margin-bottom: 28px;
      }

      p {
        color: var(--muted);
        line-height: 1.55;
        margin: 8px 0 0;
        max-width: 680px;
      }

      h1 {
        font-size: clamp(34px, 8vw, 68px);
        line-height: .96;
        margin: 0;
      }

      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }

      button {
        background: white;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: inherit;
        cursor: pointer;
        display: grid;
        gap: 10px;
        min-height: 148px;
        padding: 18px;
        text-align: left;
        width: 100%;
      }

      button:hover,
      button:focus-visible {
        border-color: var(--accent);
        box-shadow: 0 12px 32px rgb(15 109 92 / 16%);
        outline: none;
      }

      .name {
        font-size: 20px;
        font-weight: 800;
      }

      .description {
        color: var(--muted);
        line-height: 1.45;
      }

      .tag {
        align-self: end;
        background: var(--accent-soft);
        border-radius: 999px;
        color: #09483d;
        display: inline-block;
        font-size: 12px;
        font-weight: 800;
        padding: 5px 9px;
        width: fit-content;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Your apps</h1>
        <p>Apps you create end up here.</p>
      </header>
      <section id="apps" class="grid" aria-label="Available apps"></section>
    </main>

    <script>
      const appsRoot = document.querySelector("#apps");
      const appLabCapability = window.__APP_LAB_CAPABILITY__;
      const requestId = crypto.randomUUID();

      window.addEventListener("message", (event) => {
        if (event.data?.type !== "APPS_LIST" || event.data.requestId !== requestId) return;
        renderApps(event.data.payload.apps);
      });

      function renderApps(apps) {
        appsRoot.replaceChildren(...apps
          .filter((app) => app.appId !== "menu")
          .map((app) => {
            const button = document.createElement("button");
            button.type = "button";
            button.innerHTML = "<span class='name'></span><span class='description'></span><span class='tag'>Open</span>";
            button.querySelector(".name").textContent = app.name;
            button.querySelector(".description").textContent = app.description || "Local app";
            button.addEventListener("click", () => {
              window.parent.postMessage({
                type: "NAVIGATE_APP",
                appLabCapability,
                payload: { appId: app.appId },
              }, "*");
            });
            return button;
          }));
      }

      window.parent.postMessage({ type: "LIST_APPS", requestId, appLabCapability }, "*");
    </script>
  </body>
</html>
